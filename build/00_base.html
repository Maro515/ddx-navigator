<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e7490">
<title>DDx Navigator</title>
<style>
:root{
  --bg:#f4f6f8;--card:#ffffff;--ink:#1a2330;--muted:#5b6b7c;--line:#dfe5ec;--pri:#0e7490;--pri-soft:#e0f2f7;
  --danger:#b91c1c;--danger-soft:#fee2e2;--warn:#b45309;--warn-soft:#fef3c7;--ok:#15803d;--ok-soft:#dcfce7;--path:#6d28d9;--path-soft:#ede9fe;
  --chip:#eef2f6;--radius:16px;--nav-h:64px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0f151c;--card:#182029;--ink:#e6edf3;--muted:#98a6b5;--line:#2a3542;--pri:#38bdf8;--pri-soft:#0c2a38;
  --danger:#f87171;--danger-soft:#3b1212;--warn:#fbbf24;--warn-soft:#3a2a08;--ok:#4ade80;--ok-soft:#0f2e1a;--path:#c4b5fd;--path-soft:#261a4a;--chip:#222c37;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f151c;--card:#182029;--ink:#e6edf3;--muted:#98a6b5;--line:#2a3542;--pri:#38bdf8;--pri-soft:#0c2a38;
  --danger:#f87171;--danger-soft:#3b1212;--warn:#fbbf24;--warn-soft:#3a2a08;--ok:#4ade80;--ok-soft:#0f2e1a;--path:#c4b5fd;--path-soft:#261a4a;--chip:#222c37;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;font-weight:700}
header.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--pri-soft);color:var(--pri)}
main{flex:1;padding:14px 16px calc(var(--nav-h) + 24px)}
section.view{display:none}section.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.urgent{border-color:var(--danger);background:var(--danger-soft)}
.card.confirm{border-color:var(--pri)}
.card h2{font-size:18px;margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .cnt{font-weight:500;color:var(--muted);font-size:14px}
.muted{color:var(--muted)}.small{font-size:15px}.tiny{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:44px}
button.big{min-height:52px;font-size:18px;padding:10px 16px;font-weight:600}
button.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.ghost{background:transparent;border-color:transparent;color:var(--pri);padding:6px 10px;min-height:36px}
button.rec{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=password],textarea{font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
textarea{resize:vertical;line-height:1.6;min-height:140px}
.ctxrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.ctxrow select{padding:8px 10px;font-size:16px}
.inputbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.inputacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.scrubbed{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:16px;white-space:pre-wrap;margin-bottom:6px}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--chip);font-size:16px}
.item.abs{color:var(--muted)}.item.abs b{text-decoration:line-through}
.item.stale{border:1px dashed var(--warn)}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid}
.banner.emergent{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.banner.warning{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.banner.path{background:var(--path-soft);border-color:var(--path);color:var(--path)}
.banner.scope{background:var(--chip);border-color:var(--line);color:var(--muted)}
.banner b{display:block;font-size:17px}.banner .msg{font-size:15px;margin-top:2px;opacity:.95}
.badge{display:inline-block;font-size:13px;padding:2px 9px;border-radius:8px;font-weight:700}
.badge.high{background:var(--ok-soft);color:var(--ok)}.badge.mid{background:var(--warn-soft);color:var(--warn)}.badge.low{background:var(--chip);color:var(--muted)}
.badge.alert{background:var(--danger-soft);color:var(--danger)}.badge.open{background:var(--warn-soft);color:var(--warn)}.badge.emergent{background:var(--danger-soft);color:var(--danger)}
.dx{border-top:1px solid var(--line);padding:10px 0}.dx:first-of-type{border-top:none}
.dx .head{display:flex;align-items:center;gap:10px;cursor:pointer}
.dx .rank{width:28px;height:28px;border-radius:50%;background:var(--chip);color:var(--muted);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dx .name{font-weight:700;flex:1;font-size:18px}
.dx .detail{margin-top:8px;font-size:15px}
.ev{margin:4px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}.ev .lab{color:var(--muted);font-size:13px;margin-right:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--chip);font-size:14px}
.tag.sup{background:var(--ok-soft);color:var(--ok)}.tag.ref{background:var(--danger-soft);color:var(--danger)}
.qitem{padding:10px 0;border-top:1px solid var(--line)}.qitem:first-of-type{border-top:none}
.qitem .q{font-size:19px;font-weight:700}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.qa button{min-height:46px;font-size:17px;font-weight:600;padding:8px 18px;border-radius:999px}
label.lab{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
label.chk{display:flex;align-items:center;gap:10px;font-size:16px;margin:12px 0}
label.chk input{width:22px;height:22px}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.log{font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line);padding:5px 0}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:16px}
details summary{cursor:pointer;color:var(--pri);font-size:16px;font-weight:600}
.disc{font-size:13px;color:var(--muted);margin-top:8px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{max-width:560px;margin:0 auto;display:flex;height:var(--nav-h)}
nav.tabs button{flex:1;border:none;background:transparent;border-radius:0;color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;position:relative}
nav.tabs button .ic{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--pri)}
nav.tabs button .n{position:absolute;top:8px;right:calc(50% - 30px);background:var(--danger);color:#fff;font-size:12px;border-radius:999px;padding:0 6px;font-weight:700}
#sheetWrap{position:fixed;inset:0;z-index:40;display:none}#sheetWrap.open{display:block}
#sheetWrap .bg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;max-height:90dvh;display:flex;flex-direction:column;box-shadow:0 -4px 30px rgba(0,0,0,.2)}
#sheet .hd{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
#sheet .body{overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.bodywrap{display:flex;justify-content:center}
svg.body{display:block;height:auto}svg.body.coarse{width:min(240px,70vw)}svg.body.fine{width:min(300px,86vw)}
svg.body .rg{fill:rgba(14,116,144,.06);stroke:rgba(14,116,144,.5);stroke-width:1;cursor:pointer;stroke-dasharray:2 2}
svg.body .rg:hover{fill:rgba(14,116,144,.25)}
svg.body .rl{font-size:10px;fill:#1a2330;text-anchor:middle;pointer-events:none;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round}
svg.body .rl.fine{font-size:7px;stroke-width:2px}
svg.body .note{font-size:8px;fill:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:8px;color:var(--muted);font-weight:700;font-size:16px;min-height:40px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:var(--chip);font-size:15px;cursor:pointer;min-height:40px}
svg.body .rg:active{fill:rgba(14,116,144,.3)}
.fsec{margin:8px 0}.fsec .lab{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:6px}
.labgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.labbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;min-height:60px;text-align:left}
.labbtn.done{border-color:var(--ok);background:var(--ok-soft)}
.labbtn .ln{font-weight:700;font-size:17px}.labbtn .lv{font-size:13px;color:var(--muted)}
.calc .disp{font-size:34px;font-weight:700;text-align:right;padding:10px 14px;background:var(--chip);border-radius:12px;min-height:60px;font-variant-numeric:tabular-nums;margin-bottom:6px}
.calc .disp .unit{font-size:16px;color:var(--muted);margin-left:8px;font-weight:500}
.calc .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.calc .keys button{min-height:58px;font-size:24px;font-weight:600}
.tawrap{position:relative}
.tawrap textarea{padding-right:64px;padding-bottom:56px}
button.mic{position:absolute;right:10px;bottom:10px;width:52px;height:52px;border-radius:50%;font-size:24px;padding:0;min-height:0;background:var(--pri-soft);border-color:var(--pri);box-shadow:var(--shadow)}
button.mic.rec{background:var(--danger-soft);border-color:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(185,28,28,.35)}50%{box-shadow:0 0 0 10px rgba(185,28,28,0)}}
.selbar{display:flex;gap:10px;align-items:center;margin-top:8px}
.chip.sel{background:var(--pri-soft);border:1px solid var(--pri);color:var(--pri);font-weight:700}
svg.body .rg.sel{fill:rgba(14,116,144,.38);stroke:var(--pri);stroke-width:2;stroke-dasharray:none}
svg.body .rg.has{fill:rgba(14,116,144,.2);stroke:var(--pri);stroke-dasharray:none}
#sheetWrap.full #sheet{max-height:100dvh;height:100dvh;border-radius:0;max-width:none}
#sheetWrap.full #sheet .body{display:flex;flex-direction:column}
.bodypair{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}
.bodycol{display:flex;flex-direction:column;align-items:center;min-height:0}
.bodycap{font-weight:700;font-size:16px;margin-bottom:4px;text-align:center}
.bodypair svg.body.coarse{width:100%;max-height:calc(100dvh - 230px)}
#sheetWrap.full svg.body.fine{width:min(96vw,560px);max-height:calc(100dvh - 260px)}
#sheetWrap.full .bodywrap{flex:1;min-height:0;align-items:center}
svg.body .rl{font-size:11px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:16px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none;max-width:90vw}
#toast.show{opacity:.95}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1>DDx Navigator</h1><div class="spacer"></div><span class="pill" id="pillLLM">AI</span></header>
  <main>
    <section class="view active" id="view-input"></section>
    <section class="view" id="view-result"></section>
    <section class="view" id="view-settings"></section>
  </main>
  <nav class="tabs"><div class="inner">
    <button data-tab="input" class="on"><span class="ic">✏️</span>入力</button>
    <button data-tab="result"><span class="ic">🩺</span>結果</button>
    <button data-tab="settings"><span class="ic">⚙️</span>設定</button>
  </div></nav>
  <div id="sheetWrap"><div class="bg"></div><div id="sheet"><div class="hd" id="sheetHd"></div><div class="body" id="sheetBody"></div></div></div>
  <div id="toast"></div>
</div>
<!--SCRIPTS-->
</body>
</html>
