<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e7490">
<title>DDx Navigator</title>
<style>
:root{
  --bg:#f4f6f8;--card:#ffffff;--ink:#1a2330;--muted:#5b6b7c;--line:#dfe5ec;--pri:#0e7490;--pri-soft:#e0f2f7;
  --danger:#b91c1c;--danger-soft:#fee2e2;--warn:#b45309;--warn-soft:#fef3c7;--ok:#15803d;--ok-soft:#dcfce7;--path:#6d28d9;--path-soft:#ede9fe;
  --chip:#eef2f6;--radius:16px;--nav-h:64px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0f151c;--card:#182029;--ink:#e6edf3;--muted:#98a6b5;--line:#2a3542;--pri:#38bdf8;--pri-soft:#0c2a38;
  --danger:#f87171;--danger-soft:#3b1212;--warn:#fbbf24;--warn-soft:#3a2a08;--ok:#4ade80;--ok-soft:#0f2e1a;--path:#c4b5fd;--path-soft:#261a4a;--chip:#222c37;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f151c;--card:#182029;--ink:#e6edf3;--muted:#98a6b5;--line:#2a3542;--pri:#38bdf8;--pri-soft:#0c2a38;
  --danger:#f87171;--danger-soft:#3b1212;--warn:#fbbf24;--warn-soft:#3a2a08;--ok:#4ade80;--ok-soft:#0f2e1a;--path:#c4b5fd;--path-soft:#261a4a;--chip:#222c37;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;font-weight:700}
header.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--pri-soft);color:var(--pri)}
main{flex:1;padding:14px 16px calc(var(--nav-h) + 24px)}
section.view{display:none}section.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.urgent{border-color:var(--danger);background:var(--danger-soft)}
.card.confirm{border-color:var(--pri)}
.card h2{font-size:18px;margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .cnt{font-weight:500;color:var(--muted);font-size:14px}
.muted{color:var(--muted)}.small{font-size:15px}.tiny{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:44px}
button.big{min-height:52px;font-size:18px;padding:10px 16px;font-weight:600}
button.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.ghost{background:transparent;border-color:transparent;color:var(--pri);padding:6px 10px;min-height:36px}
button.rec{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=password],textarea{font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
textarea{resize:vertical;line-height:1.6;min-height:140px}
.ctxrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.ctxrow select{padding:8px 10px;font-size:16px}
.inputbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.inputacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.scrubbed{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:16px;white-space:pre-wrap;margin-bottom:6px}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--chip);font-size:16px}
.item.abs{color:var(--muted)}.item.abs b{text-decoration:line-through}
.item.stale{border:1px dashed var(--warn)}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid}
.banner.emergent{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.banner.warning{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.banner.path{background:var(--path-soft);border-color:var(--path);color:var(--path)}
.banner.scope{background:var(--chip);border-color:var(--line);color:var(--muted)}
.banner b{display:block;font-size:17px}.banner .msg{font-size:15px;margin-top:2px;opacity:.95}
.badge{display:inline-block;font-size:13px;padding:2px 9px;border-radius:8px;font-weight:700}
.badge.high{background:var(--ok-soft);color:var(--ok)}.badge.mid{background:var(--warn-soft);color:var(--warn)}.badge.low{background:var(--chip);color:var(--muted)}
.badge.alert{background:var(--danger-soft);color:var(--danger)}.badge.open{background:var(--warn-soft);color:var(--warn)}.badge.emergent{background:var(--danger-soft);color:var(--danger)}
.dx{border-top:1px solid var(--line);padding:10px 0}.dx:first-of-type{border-top:none}
.dx .head{display:flex;align-items:center;gap:10px;cursor:pointer}
.dx .rank{width:28px;height:28px;border-radius:50%;background:var(--chip);color:var(--muted);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dx .name{font-weight:700;flex:1;font-size:18px}
.dx .detail{margin-top:8px;font-size:15px}
.ev{margin:4px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}.ev .lab{color:var(--muted);font-size:13px;margin-right:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--chip);font-size:14px}
.tag.sup{background:var(--ok-soft);color:var(--ok)}.tag.ref{background:var(--danger-soft);color:var(--danger)}
.qitem{padding:10px 0;border-top:1px solid var(--line)}.qitem:first-of-type{border-top:none}
.qitem .q{font-size:19px;font-weight:700}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.qa button{min-height:46px;font-size:17px;font-weight:600;padding:8px 18px;border-radius:999px}
label.lab{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
label.chk{display:flex;align-items:center;gap:10px;font-size:16px;margin:12px 0}
label.chk input{width:22px;height:22px}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.log{font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line);padding:5px 0}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:16px}
details summary{cursor:pointer;color:var(--pri);font-size:16px;font-weight:600}
.disc{font-size:13px;color:var(--muted);margin-top:8px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{max-width:560px;margin:0 auto;display:flex;height:var(--nav-h)}
nav.tabs button{flex:1;border:none;background:transparent;border-radius:0;color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;position:relative}
nav.tabs button .ic{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--pri)}
nav.tabs button .n{position:absolute;top:8px;right:calc(50% - 30px);background:var(--danger);color:#fff;font-size:12px;border-radius:999px;padding:0 6px;font-weight:700}
#sheetWrap{position:fixed;inset:0;z-index:40;display:none}#sheetWrap.open{display:block}
#sheetWrap .bg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;max-height:90dvh;display:flex;flex-direction:column;box-shadow:0 -4px 30px rgba(0,0,0,.2)}
#sheet .hd{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
#sheet .body{overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.bodywrap{display:flex;justify-content:center}
svg.body{display:block;height:auto}svg.body.coarse{width:min(240px,70vw)}svg.body.fine{width:min(300px,86vw)}
svg.body .rg{fill:rgba(14,116,144,.06);stroke:rgba(14,116,144,.5);stroke-width:1;cursor:pointer;stroke-dasharray:2 2}
svg.body .rg:hover{fill:rgba(14,116,144,.25)}
svg.body .rl{font-size:10px;fill:#1a2330;text-anchor:middle;pointer-events:none;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round}
svg.body .rl.fine{font-size:7px;stroke-width:2px}
svg.body .note{font-size:8px;fill:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:8px;color:var(--muted);font-weight:700;font-size:16px;min-height:40px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:var(--chip);font-size:15px;cursor:pointer;min-height:40px}
svg.body .rg:active{fill:rgba(14,116,144,.3)}
.fsec{margin:8px 0}.fsec .lab{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:6px}
.labgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.labbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;min-height:60px;text-align:left}
.labbtn.done{border-color:var(--ok);background:var(--ok-soft)}
.labbtn .ln{font-weight:700;font-size:17px}.labbtn .lv{font-size:13px;color:var(--muted)}
.calc .disp{font-size:34px;font-weight:700;text-align:right;padding:10px 14px;background:var(--chip);border-radius:12px;min-height:60px;font-variant-numeric:tabular-nums;margin-bottom:6px}
.calc .disp .unit{font-size:16px;color:var(--muted);margin-left:8px;font-weight:500}
.calc .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.calc .keys button{min-height:58px;font-size:24px;font-weight:600}
.tawrap{position:relative}
.tawrap textarea{padding-right:64px;padding-bottom:56px}
button.mic{position:absolute;right:10px;bottom:10px;width:52px;height:52px;border-radius:50%;font-size:24px;padding:0;min-height:0;background:var(--pri-soft);border-color:var(--pri);box-shadow:var(--shadow)}
button.mic.rec{background:var(--danger-soft);border-color:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(185,28,28,.35)}50%{box-shadow:0 0 0 10px rgba(185,28,28,0)}}
.selbar{display:flex;gap:10px;align-items:center;margin-top:8px}
.chip.sel{background:var(--pri-soft);border:1px solid var(--pri);color:var(--pri);font-weight:700}
svg.body .rg.sel{fill:rgba(14,116,144,.38);stroke:var(--pri);stroke-width:2;stroke-dasharray:none}
svg.body .rg.has{fill:rgba(14,116,144,.2);stroke:var(--pri);stroke-dasharray:none}
#sheetWrap.full #sheet{max-height:100dvh;height:100dvh;border-radius:0;max-width:none}
#sheetWrap.full #sheet .body{display:flex;flex-direction:column}
.bodypair{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}
.bodycol{display:flex;flex-direction:column;align-items:center;min-height:0}
.bodycap{font-weight:700;font-size:16px;margin-bottom:4px;text-align:center}
.bodypair svg.body.coarse{width:100%;max-height:calc(100dvh - 230px)}
#sheetWrap.full svg.body.fine{width:min(96vw,560px);max-height:calc(100dvh - 260px)}
#sheetWrap.full .bodywrap{flex:1;min-height:0;align-items:center}
svg.body .rl{font-size:11px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:16px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none;max-width:90vw}
#toast.show{opacity:.95}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
  .dx .head .prev { font-size: 12px; color: var(--muted); white-space: nowrap; margin-left: 6px; }
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1>DDx Navigator</h1><div class="spacer"></div><span class="pill" id="pillLLM">AI</span></header>
  <main>
    <section class="view active" id="view-input"></section>
    <section class="view" id="view-result"></section>
    <section class="view" id="view-settings"></section>
  </main>
  <nav class="tabs"><div class="inner">
    <button data-tab="input" class="on"><span class="ic">✏️</span>入力</button>
    <button data-tab="result"><span class="ic">🩺</span>結果</button>
    <button data-tab="settings"><span class="ic">⚙️</span>設定</button>
  </div></nav>
  <div id="sheetWrap"><div class="bg"></div><div id="sheet"><div class="hd" id="sheetHd"></div><div class="body" id="sheetBody"></div></div></div>
  <div id="toast"></div>
</div>
<script>/* 10_kb.js */
/* ============================================================
 * Medical Knowledge DB  —  腹痛/下痢パック v0.1 (成人・救急/一般外来)
 *  - FeatureDefinition / Disease / DiseaseFeatureRelation
 *  - AcquisitionMetadata / 時間バケット / freshness policy
 *  注意: v0.1 は専門家レビュー前のドラフト。sens/spec は文献値の近似であり
 *        診療推奨値ではない。すべて EvidenceSource で置換・承認する前提。
 * ============================================================ */
(function (g) {
  const KB = {};
  KB.version = 'abd-pack-0.2.1';
  KB.scope = { label: '成人の急性腹痛・急性下痢（外来/救急）', min_age_band: '18-29' };

  /* ---------- 時間バケット ---------- */
  KB.time = {
    tier1: [
      { code: 'minutes', label: '数分' }, { code: 'hours', label: '数時間' }, { code: 'days', label: '数日' },
      { code: 'weeks', label: '数週間' }, { code: 'months', label: '数か月以上' }, { code: 'unknown', label: '不明' }
    ],
    tier2: {
      minutes: [{ code: 'min_lt10', label: '<10分' }, { code: 'min_10_30', label: '10-30分' }, { code: 'min_30_60', label: '30-60分' }],
      hours: [{ code: 'h_1_3', label: '1-3時間' }, { code: 'h_3_6', label: '3-6時間' }, { code: 'h_6_12', label: '6-12時間' }, { code: 'h_12_24', label: '12-24時間' }],
      days: [{ code: 'd_1_2', label: '1-2日' }, { code: 'd_3_7', label: '3-7日' }],
      weeks: [{ code: 'w_1_2', label: '1-2週' }, { code: 'w_3_4', label: '3-4週' }],
      months: [{ code: 'm_1_3', label: '1-3か月' }, { code: 'm_gt3', label: '>3か月' }],
      unknown: [{ code: 'unk_patient', label: '患者不明' }, { code: 'unk_unconfirmed', label: '未確認' }]
    },
    // 代表時間(h)。算術はコード側で行う（Jevに日付差を任せない）
    hours: {
      minutes: 0.5, min_lt10: 0.1, min_10_30: 0.33, min_30_60: 0.75,
      hours: 6, h_1_3: 2, h_3_6: 4.5, h_6_12: 9, h_12_24: 18,
      days: 72, d_1_2: 36, d_3_7: 120,
      weeks: 400, w_1_2: 250, w_3_4: 600,
      months: 3000, m_1_3: 1500, m_gt3: 4000,
      unknown: null, unk_patient: null, unk_unconfirmed: null
    },
    tier1Of(code) {
      if (!code) return 'unknown';
      for (const t of KB.time.tier1) if (t.code === code) return code;
      for (const k in KB.time.tier2) if (KB.time.tier2[k].some(x => x.code === code)) return k;
      return 'unknown';
    },
    label(code) {
      for (const t of KB.time.tier1) if (t.code === code) return t.label;
      for (const k in KB.time.tier2) { const f = KB.time.tier2[k].find(x => x.code === code); if (f) return f.label; }
      return code || '';
    }
  };
  KB.trend = [
    { code: 'worsening', label: '悪化' }, { code: 'stable', label: '持続' }, { code: 'improving', label: '改善' },
    { code: 'fluctuating', label: '変動' }, { code: 'resolved', label: '消失' }, { code: 'unknown', label: '不明' }
  ];
  KB.severity = [{ code: 'mild', label: '軽' }, { code: 'moderate', label: '中' }, { code: 'severe', label: '高' }];
  KB.status = [
    { code: 'present', label: 'あり' }, { code: 'absent', label: 'なし' }, { code: 'unknown', label: '不明' },
    { code: 'not_assessed', label: '未評価/実施不可' }, { code: 'pending', label: '結果待ち' }
  ];
  KB.anchorLabel = { onset: '発症からの経過', observation: '確認してからの経過', collection: '採取からの経過', imaging: '実施からの経過', history: '発生/終了からの経過', none: '' };

  /* ---------- Freshness policy (h) : type 既定、feature で上書き ---------- */
  KB.freshness = { vital: 3, exam: 6, lab: 24, imaging: 72, symptom: null, chief_complaint: null, history: null, context: null };

  /* ---------- 文脈 (Clinical context) ---------- */
  KB.context = {
    age_band: [{ code: 'lt18', label: '<18(対象外)' }, { code: '18-29', label: '18-29' }, { code: '30-39', label: '30-39' }, { code: '40-49', label: '40-49' },
      { code: '50-59', label: '50-59' }, { code: '60-69', label: '60-69' }, { code: '70-79', label: '70-79' }, { code: '80+', label: '80+' }],
    sex: [{ code: 'female', label: '女性' }, { code: 'male', label: '男性' }],
    setting: [{ code: 'emergency', label: '救急外来' }, { code: 'outpatient', label: '一般外来' }, { code: 'night', label: '当直' }],
    pregnancy: [{ code: 'no', label: '妊娠可能性なし' }, { code: 'possible', label: '可能性あり' }, { code: 'confirmed', label: '妊娠中' }, { code: 'unknown', label: '未確認' }],
    preg_stage: [{ code: 'first_tri', label: '妊娠初期（〜13週）' }, { code: 'late', label: '妊娠中期〜後期' }, { code: 'postpartum', label: '産褥（産後6週以内）' }, { code: 'infertility_tx', label: '不妊治療中' }],
    trauma: [{ code: 'no', label: '外傷なし' }, { code: 'yes', label: '外傷あり' }]
  };
  KB.ageIndex = { 'lt18': 0, '18-29': 1, '30-39': 2, '40-49': 3, '50-59': 4, '60-69': 5, '70-79': 6, '80+': 7 };

  /* ---------- Feature definitions ---------- */
  // cat: UI カテゴリ, type: feature_type, anchor: 時間の意味, tier2: 二次時間を出す, sev: 程度を聞く
  // acq: {cost, inv, delay, stage}, group: 冗長判定グループ, base: 集団での陽性率(EIG用), mgmt: 管理方針を変える度合(0-3)
  const V = {
    loc: [['rlq', '右下腹部'], ['ruq', '右上腹部'], ['epi', '心窩部'], ['llq', '左下腹部'], ['luq', '左上腹部'], ['umb', '臍周囲'], ['diffuse', 'び漫性'], ['supra', '下腹部正中'], ['flank_r', '右側腹/背部'], ['flank_l', '左側腹/背部']],
    temp: [['lt36', '<36.0(低体温)'], ['lt375', '<37.5'], ['375_38', '37.5-38.0'], ['38_39', '38.0-39.0'], ['ge39', '≥39.0']],
    hr: [['lt60', '<60'], ['60_100', '60-100'], ['100_120', '100-120'], ['gt120', '>120']],
    sbp: [['lt90', '<90'], ['90_100', '90-100'], ['100_140', '100-140'], ['gt140', '>140']],
    rr: [['le20', '≤20'], ['21_24', '21-24'], ['gt24', '>24']],
    spo2: [['ge94', '≥94%'], ['lt94', '<94%']],
    consc: [['alert', '清明'], ['altered', '意識変容']],
    wbc: [['lt4', '<4,000'], ['4_10', '4,000-10,000'], ['10_15', '10,000-15,000'], ['gt15', '>15,000']],

<script>/* 19_labs.js */
/* ============================================================
 * 検査値パネル — 救急で測る血算＋生化学の一覧。数値 → KB の値コードへ（閾値はコード側で判定）
 *  単位・基準値: 国立がん研究センター中央病院 臨床検査科「検査基準値一覧」
 *   https://www.ncc.go.jp/jp/ncch/division/clinical_laboratory/kensa.pdf（2026-09-26 参照）
 *  Hb の低下閾値はオーナー指定（男 <13 / 女 <12）。乳酸・NT-proBNP は同表に無く一般的単位。
 *  map: null の項目は KB に対応 feature が無く、テキストとして入力欄に残す。map は {f, code, status?} かその配列を返す
 *  異常の閾値は臨床的カットオフ（2026-09-27 オーナー指定: 低Na <135、高K >5.5、低K <3.5、高Ca >10.5、Plt <15）
 * ============================================================ */
(function (g) {
  const DDX = g.DDX = g.DDX || {};
  const L = (id, label, unit, map, o) => Object.assign({ id, label, unit, map }, o || {});
  const male = ctx => ctx && ctx.sex === 'male';
  DDX.LABS = {
    source: { label: '国立がん研究センター 検査基準値一覧', url: 'https://www.ncc.go.jp/jp/ncch/division/clinical_laboratory/kensa.pdf' },
    groups: [
      { label: '血算', items: [
        L('wbc', 'WBC', '10³/μL', v => ({ f: 'wbc', code: v < 4000 ? 'lt4' : v <= 10000 ? '4_10' : v <= 15000 ? '10_15' : 'gt15' }), { hint: '基準 3.3～8.6。例 12.3（12300 と入れても可）', norm: v => v < 100 ? v * 1000 : v }),
        L('hb', 'Hb', 'g/dL', (v, ctx) => ({ f: 'hb', code: v < (male(ctx) ? 13 : 12) ? 'low' : 'normal' }), { hint: '低下: 男 <13 / 女 <12（基準 男 13.7～16.8 / 女 11.6～14.8。性別未設定は 12）' }),
        L('plt', 'Plt', '10⁴/μL', v => v < 15 ? { f: 'chronic_liver_labs', code: 'plt_low' } : { f: 'chronic_liver_labs', code: 'plt_low', status: 'absent' }, { hint: '減少: <15（臨床的定義 15万/μL）。基準 15.8～34.8。12.3 のように入力（123000 も可）', norm: v => v >= 1000 ? v / 10000 : v >= 100 ? v / 10 : v })
      ] },
      { label: '生化学', items: [
        L('crp', 'CRP', 'mg/dL', v => ({ f: 'crp', code: v < 1 ? 'lt1' : v <= 5 ? '1_5' : v <= 10 ? '5_10' : 'gt10' }), { hint: '基準 0.14 以下。区分 1 / 5 / 10' }),
        L('ast', 'AST', 'U/L', v => ({ f: 'liver_enz', code: v > 30 ? 'elevated' : 'normal' }), { hint: '基準 13～30' }),
        L('alt', 'ALT', 'U/L', (v, ctx) => ({ f: 'liver_enz', code: v > (male(ctx) ? 42 : 23) ? 'elevated' : 'normal' }), { hint: '基準 男 10～42 / 女 7～23' }),
        L('alp', 'ALP', 'U/L', v => ({ f: 'alp_ggt', code: v > 322 ? 'elevated' : 'normal' }), { hint: '基準 106～322（JSCC 法）' }),
        L('ggt', 'γ-GTP', 'U/L', (v, ctx) => ({ f: 'alp_ggt', code: v > (male(ctx) ? 64 : 32) ? 'elevated' : 'normal' }), { hint: '基準 男 13～64 / 女 9～32' }),
        L('tbil', 'T-Bil', 'mg/dL', v => ({ f: 'bili', code: v > 1.5 ? 'elevated' : 'normal' }), { hint: '基準 0.4～1.5' }),
        L('amy', 'アミラーゼ', 'U/L', v => ({ f: 'lipase', code: v >= 396 ? 'ge3x' : v > 132 ? 'lt3x' : 'normal' }), { hint: '基準 44～132（3倍 = 396）' }),
        L('lip', 'リパーゼ', 'U/L', v => ({ f: 'lipase', code: v >= 165 ? 'ge3x' : v > 55 ? 'lt3x' : 'normal' }), { hint: '基準 13～55（3倍 = 165）' }),
        L('bun', 'BUN', 'mg/dL', v => ({ f: 'renal', code: v > 20 ? 'elevated' : 'normal' }), { hint: '基準 8～20' }),
        L('cre', 'Cre', 'mg/dL', (v, ctx) => ({ f: 'renal', code: v > (male(ctx) ? 1.07 : 0.79) ? 'elevated' : 'normal' }), { hint: '基準 男 0.65～1.07 / 女 0.46～0.79' }),
        L('na', 'Na', 'mmol/L', v => ({ f: 'electrolyte', code: 'hypona', status: v < 135 ? 'present' : 'absent' }), { hint: '低Na: <135（臨床的定義）。基準 138～145' }),
        L('k', 'K', 'mmol/L', v => [{ f: 'electrolyte', code: 'hyperk', status: v > 5.5 ? 'present' : 'absent' }, { f: 'electrolyte', code: 'hypok', status: v < 3.5 ? 'present' : 'absent' }], { hint: '高K: >5.5 / 低K: <3.5（臨床的定義）。基準 3.6～4.8' }),
        L('cl', 'Cl', 'mmol/L', null, { hint: '基準 101～108（記録のみ）' }),
        L('ca', 'Ca', 'mg/dL', v => ({ f: 'electrolyte', code: 'hyperca', status: v > 10.5 ? 'present' : 'absent' }), { hint: '高Ca: >10.5（臨床的定義。低Alb なら補正Ca を入力）。基準 8.8～10.1' }), L('p', 'P（無機リン）', 'mg/dL', null, { hint: '基準 2.7～4.6（記録のみ）' }), L('mg', 'Mg', 'mg/dL', null, { hint: '基準 1.8～2.4（記録のみ）' }),
        L('glu', '血糖', 'mg/dL', v => ({ f: 'glucose', code: v > 250 ? 'gt250' : 'normal' }), { hint: '基準 73～109（血清）。>250 で高血糖' }),
        L('lac', '乳酸', 'mmol/L', v => ({ f: 'lactate', code: v < 2 ? 'lt2' : v <= 4 ? '2_4' : 'gt4' }), { hint: '区分 2 / 4' }),
        L('ck', 'CK', 'U/L', (v, ctx) => ({ f: 'ck', code: v > (male(ctx) ? 248 : 153) ? 'elevated' : 'normal' }), { hint: '上昇: 基準上限超（男 248 / 女 153）' }), L('ckmb', 'CK-MB', 'ng/mL', null, { hint: '基準 3.6 以下（記録のみ）' }),
        L('ldh', 'LD', 'U/L', v => ({ f: 'ldh', code: v > 222 ? 'elevated' : 'normal' }), { hint: '上昇: >222（基準 124～222）' }),
        L('ddimer', 'D-dimer', 'μg/mL', v => ({ f: 'ddimer', code: v >= 1.0 ? 'elevated' : 'normal' }), { hint: '基準 1.0 未満' }),
        L('tni', 'トロポニンI', 'ng/mL', v => ({ f: 'troponin', code: v > 0.03 ? 'pos' : 'neg' }), { hint: '基準 0.03 以下（施設の hs 法では要調整）' }),
        L('bnp', 'BNP', 'pg/mL', null, { hint: '基準 18.4 以下（記録のみ）' }), L('ntprobnp', 'NT-proBNP', 'pg/mL', null, { hint: '記録のみ' }),
        L('nh3', 'アンモニア', 'μg/dL', v => ({ f: 'ammonia', code: v > 66 ? 'elevated' : 'normal' }), { hint: '上昇: >66（基準 12～66）' })
      ] },
      { label: '尿検査（一般）', items: [
        L('ua', '尿定性', '', null, { choice: [['normal', '正常（潜血− 白血球−）'], ['pyuria', '膿尿（白血球エステラーゼ＋）'], ['hematuria', '血尿（潜血＋）'], ['both', '膿尿＋血尿']], f: 'urinalysis' })
      ] }
    ],
    byId: {}
  };
  for (const gr of DDX.LABS.groups) for (const it of gr.items) DDX.LABS.byId[it.id] = it;

  /* 入力済みの検査値すべて → 所見のリスト（純粋関数）。
     - 同じ項目に書く検査（AST/ALT、BUN/Cre、アミラーゼ/リパーゼ、ALP/γ-GTP）は最も異常な値を採る（後から入れた正常値で上書きしない）
     - 複数選択の項目（電解質など）は値ごとに「あり/なし」

<script>/* 20_state.js */
/* ============================================================
 * Clinical State Engine — 観測値・欠損・時系列・履歴を一元管理

  }

    { from: 'diabetes_new_worsening', to: 'diabetes', why: '糖尿病の新規発症/悪化' },
    { from: 'diabetes', to: 'cv_risk', why: '糖尿病' },
    { from: 'ecg', values: ['af'], to: 'af_vascular', why: '心電図で心房細動' },

<script>/* 30_safety.js */
/* ============================================================
 * Safety Engine — 緊急条件・適用外・前提・矛盾を Jev/LLM より先にコードで判定
 * ============================================================ */
(function (g) {
  const DDX = g.DDX = g.DDX || {};
  const KB = () => DDX.KB;

  function ageIdx(b) { const i = KB().ageIndex[b]; return (i === undefined) ? null : i; }

  function evalCond(c, state) {
    if (!c) return false;
    if (c.all) return c.all.every(x => evalCond(x, state));
    if (c.any) return c.any.some(x => evalCond(x, state));
    if (c.count2) return c.count2.filter(x => evalCond(x, state)).length >= 2;
    if (c.ctx) {
      const v = state.context[c.ctx];
      if (c.ctx === 'age_max') { const a = ageIdx(state.context.age_band); return a !== null && a <= ageIdx(c.is); }
      if (c.ctx === 'age_min') { const a = ageIdx(state.context.age_band); return a !== null && a >= ageIdx(c.is); }
      if (c.ctx === 'pregnancy_not') { const p = state.context.pregnancy; return p !== c.is; }
      return v === c.is;
    }
    if (c.f) {
      if (c.unobserved) return !state.isAnswered(c.f);
      if (c.present) return state.has(c.f, null);
      if (c.absent) return state.isAbsent(c.f);
      if (c.in) return state.has(c.f, c.in);
    }
    return false;
  }

    const kb = KB();
    const alerts = [], contradictions = [], forced = [], forcedReason = {};
    let scope = { status: 'in_scope', messages: [] };
    for (const r of kb.scopeRules) if (evalCond(r.when, state)) {
      if (r.status === 'out_of_scope') scope.status = 'out_of_scope'; else if (scope.status !== 'out_of_scope') scope.status = 'special_path';
      scope.messages.push(r.message);
    }
    for (const r of kb.safetyRules) if (evalCond(r.when, state)) {
      alerts.push({ id: r.id, level: r.level, label: r.label, message: r.message, force_next: r.force_next });
      for (const f of r.force_next || []) if (!state.isAnswered(f)) { if (!forced.includes(f)) forced.push(f); (forcedReason[f] = forcedReason[f] || []).push(r.label); }
    }
    for (const r of kb.prerequisiteRules) if (evalCond(r.when, state)) {
      for (const f of r.force_next || []) if (!state.isAnswered(f)) { if (!forced.includes(f)) forced.push(f); (forcedReason[f] = forcedReason[f] || []).push(r.label); }
    }
    for (const r of kb.contradictionRules) if (evalCond(r.when, state)) contradictions.push({ id: r.id, message: r.message });

      alerts, scope, contradictions, forced, forcedReason, stale: stale.map(o => o.feature_id),
      emergent: alerts.some(a => a.level === 'emergent'),
      rules_version: kb.rulesVersion
    };

<script>/* 40_ddx.js */

 * Differential Engine — 候補生成 → 適用判定 → スコアリング → Likely Top10 / Must-not-miss

        questions: ['relevant_to_separating_top_diseases', 'could_change_near_term_management', 'already_represented', 'urgency_now']
      };
    },
    async evaluate(state, ddx, candidates) {
      const t0 = Date.now();
      const prov = Jev.config.provider;
      if (prov === 'none') return null;
      const payload = Jev.buildPayload(state, ddx, candidates);
      try {
        let results;
        if (prov === 'mock') results = Jev.mock(payload);
        else if (prov === 'remote') results = await Jev.remote(payload);
        else throw new Error('unknown provider');
        return { ok: true, provider: prov, results, latency: Date.now() - t0, payload };
      } catch (e) {
        return { ok: false, provider: prov, results: {}, latency: Date.now() - t0, error: String(e && e.message || e), payload };
      }
    },
    /* 模擬 Jev: 決定的ヒューリスティック（A/B ハーネスと UI 確認用。臨床的意味はない） */
    mock(payload) {
      const kb = DDX.KB; const out = {};
      const tops = payload.current_top_diseases.map(x => x.id).concat(payload.must_not_miss_open.map(x => x.id));
      const observed = new Set(payload.observed_features.map(o => o.feature));
      for (const c of payload.candidate_features) {
        const rels = (kb.relByFeature[c.feature] || []).filter(r => tops.includes(r.d));
        const rel = Math.min(1, rels.length / Math.max(2, tops.length * 0.6));
        const f = kb.feature[c.feature];
        const dup = f.group && payload.observed_features.some(o => kb.feature[o.feature].group === f.group) ? 0.5 : 1;
        out[c.feature] = { relevant: rel > 0.3, relevance: Math.round(rel * dup * 100) / 100, confidence: rels.length ? 0.8 : 0.4 };
      }
      return out;
    },
    async remote(payload) {
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const t = ctrl && setTimeout(() => ctrl.abort(), Jev.config.timeoutMs);
      try {
        const res = await fetch(Jev.config.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', ...(Jev.config.apiKey ? { Authorization: 'Bearer ' + Jev.config.apiKey } : {}) }, body: JSON.stringify(payload), signal: ctrl ? ctrl.signal : undefined });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const j = await res.json();
        const out = {};
        for (const r of (j.results || [])) out[r.feature] = { relevant: !!r.relevant, relevance: Number(r.relevance ?? (r.relevant ? 1 : 0)), confidence: Number(r.confidence ?? 0.5) };
        return out;
      } finally { if (t) clearTimeout(t); }
    }
  };
  DDX.NextItem = { compute, featureApplicable };
  DDX.Jev = Jev;
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* 60_audit.js */
/* ============================================================
 * Audit / Registry — 版固定・入出力ログ（localStorage、改変UIなし）
 * ============================================================ */
(function (g) {
  const DDX = g.DDX = g.DDX || {};
  DDX.ENGINE_VERSION = '0.1.0';
  const KEY = 'ddxnav_audit_v1';
  const MAX = 300;
  const store = () => { try { return g.localStorage; } catch (e) { return null; } };
  let mem = [];
  function load() { const s = store(); if (!s) return mem; try { return JSON.parse(s.getItem(KEY) || '[]'); } catch (e) { return []; } }
  function save(list) { const s = store(); if (!s) { mem = list; return; } try { s.setItem(KEY, JSON.stringify(list)); } catch (e) { } }
  const Audit = {
    versions() { return { engine_version: DDX.ENGINE_VERSION, kb_version: DDX.KB.version, rule_version: DDX.KB.rulesVersion, jev_adapter: DDX.Jev ? DDX.Jev.version : null, jev_provider: DDX.Jev ? DDX.Jev.config.provider : 'none' }; },
    log(entry) {
      const list = load();
      list.push(Object.assign({ ts: Date.now(), versions: Audit.versions() }, entry));
      while (list.length > MAX) list.shift();
      save(list);
      return list[list.length - 1];
    },
    list() { return load(); },
    clear() { save([]); },
    export() { return JSON.stringify({ exported_at: new Date().toISOString(), versions: Audit.versions(), entries: load() }, null, 2); }
  };
  DDX.Audit = Audit;

  /* 一括更新パイプライン（API更新フロー 1→8） */
  DDX.run = async function (state, opts) {
    opts = opts || {};
    const safety = DDX.Safety.evaluate(state);
    const ddx = DDX.Differential.compute(state, safety);
    let jev = null;
    if (opts.jev !== false && DDX.Jev.config.provider !== 'none') {
      const pre = DDX.NextItem.compute(state, ddx, safety, {});
      jev = await DDX.Jev.evaluate(state, ddx, pre.all);
    }
    const next = DDX.NextItem.compute(state, ddx, safety, { jev });
    const out = { safety, ddx, next, state_hash: state.hash(), computed_at: Date.now() };
    if (!opts.noLog) DDX.Audit.log({
      case_token: state.case_token, state_hash: out.state_hash, n_obs: ddx.nObs,
      top10: ddx.likely.filter(x => !x.comorbid).map(x => x.id), mnm_alert: ddx.mnm.filter(m => m.status === 'alert').map(m => m.id),
      next5: next.top.map(x => x.feature_id), forced: next.forced.map(x => x.feature_id),
      safety_alerts: safety.alerts.map(a => a.id), scope: safety.scope.status, contradictions: safety.contradictions.map(c => c.id),
      jev: next.jev, action: opts.action || 'update'
    });
    return out;
  };
  DDX.runSync = function (state) {
    const safety = DDX.Safety.evaluate(state);
    const ddx = DDX.Differential.compute(state, safety);
    const next = DDX.NextItem.compute(state, ddx, safety, {});
    return { safety, ddx, next, state_hash: state.hash() };
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* 65_extract.js */
/* ============================================================
 * Free-text → 構造化 Observation
 *  1) PII scrub（送信前に必ず実行、除去内容を可視化）
 *  2) LLM 抽出（Claude Messages API、tool use で JSON を強制。カタログ外の語は捨てる）
 *  3) ローカル抽出（日本語ルール。API 不可時の fallback、数値は常にコード側で判定）
 * ============================================================ */
(function (g) {
  const DDX = g.DDX = g.DDX || {};
  const KB = () => DDX.KB;

  /* ---------------- PII scrub ---------------- */
  const AGE_BANDS = [[0, 17, 'lt18', '18歳未満'], [18, 29, '18-29', '18-29歳'], [30, 39, '30-39', '30代'], [40, 49, '40-49', '40代'], [50, 59, '50-59', '50代'], [60, 69, '60-69', '60代'], [70, 79, '70-79', '70代'], [80, 200, '80+', '80歳以上']];
  function ageBand(n) { for (const [a, b, code, label] of AGE_BANDS) if (n >= a && n <= b) return { code, label }; return null; }
  function scrub(text) {
    const removed = [];
    let t = String(text || '');
    const rep = (re, tag, fn) => { t = t.replace(re, (m, ...a) => { const r = fn ? fn(m, ...a) : tag; if (r !== m) removed.push({ kind: tag, text: m }); return r; }); };
    rep(/[\w.+-]+@[\w-]+\.[\w.-]+/g, '[メール]');
    rep(/0\d{1,4}[-‐ー–]\d{1,4}[-‐ー–]\d{3,4}|0\d{9,10}(?!\d)/g, '[電話]');
    rep(/(?<![\d-])〒?\s?\d{3}-\d{4}(?![\d-])/g, '[郵便番号]');
    rep(/(?:生年月日|誕生日)\s*[:：]?\s*[^\s、。]+/g, '[生年月日]');
    rep(/(?:昭和|平成|令和|S|H|R)\s?\d{1,2}[年./]\s?\d{1,2}[月./]\s?\d{1,2}日?/g, '[日付]');
    rep(/(?:19|20)\d{2}\s?[年./-]\s?\d{1,2}\s?[月./-]\s?\d{1,2}\s?日?/g, '[日付]');
    rep(/(?<![\d])\d{1,2}月\d{1,2}日/g, '[日付]');
    rep(/(?:患者|カルテ|受診|診察券)?(?:ID|番号|No\.?)\s*[:：]?\s*[A-Za-z0-9-]{4,}/gi, '[ID]');
    rep(/(?<![\d.])\d{6,}(?![\d.])/g, '[ID]');
    rep(/(?:北海道|東京都|京都府|大阪府|.{1,3}県)[^\s、。]{1,15}?(?:市|区|郡|町|村)[^\s、。]{0,20}/g, '[住所]');
    rep(/(?:氏名|患者名|名前|お名前)\s*[:：]?\s*[^\s、。]{1,10}/g, '[氏名]');
    rep(/[一-龥ぁ-んァ-ヶー]{1,6}(?:さん|様|氏|くん|ちゃん)(?![\wぁ-ん])/g, '[氏名]');
    rep(/(\d{1,3})\s*歳/g, '[年齢]', (m, n) => { const b = ageBand(parseInt(n, 10)); return b ? b.label : '[年齢]'; });

  }

  /* ---------------- カタログ（LLM への説明とローカル辞書で共用） ---------------- */
  function catalogText() {
    const kb = KB(); const lines = [];
    for (const f of kb.features) {
      const vals = f.values ? ' 値: ' + f.values.map(v => `${v.code}=${v.label}`).join(', ') : ' 値: なし(present/absent で表現)';

    return lines.join('\n') + `\n\n時間バケット(elapsed_bucket): ${buckets}\n経過(trend): ${kb.trend.map(x => `${x.code}=${x.label}`).join(', ')}\n程度(severity): mild=軽, moderate=中, severe=高\n文脈: age_band ∈ {${kb.context.age_band.map(x => x.code).join(', ')}}, sex ∈ {female, male}, pregnancy ∈ {no, possible, confirmed, unknown}`;
  }
  const SYSTEM = () => `あなたは救急・一般外来の医師の口述メモから、鑑別診断支援システムの構造化項目を抽出する係です。
出力は必ず record_findings ツールを1回呼び出して返してください。自由文は書きません。
ルール:
- 下のカタログにある feature_id と value_code だけを使う。該当しない情報は unmapped に短く列挙し、無理に当てはめない。
- 「なし/否定/陰性」は status=absent、「不明/聞けていない」は unknown。それ以外は present。値付き項目の特定の値だけを否定する場合（「めまいなし」「黒色便なし」）は status=absent に value_code も付ける。項目全体の否定は value_code=null。

- 肝胆膵・脾・腎梗塞・腹水・腸重積・腸管壁肥厚などの CT 所見も ct の値にする。MRI/MRCP の同じ所見も ct に入れる（例: 「MRCPで総胆管拡張」→ ct biliary_dilation、「CTで門脈血栓」→ ct pvt、「CTで腹水」→ ct ascites）。身体診察の腹水（波動・濁音界移動）だけが ascites_exam。

- 各項目には根拠となった短い引用(quote)を付ける。

カタログ:
${catalogText()}`;

    input_schema: {
      type: 'object', additionalProperties: false, required: ['items', 'context', 'unmapped'],
      properties: {
        items: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['feature_id', 'value_code', 'status', 'elapsed_bucket', 'trend', 'severity', 'quote'],
          properties: { feature_id: { type: 'string' }, value_code: { type: ['string', 'null'] }, status: { type: 'string', enum: ['present', 'absent', 'unknown'] }, elapsed_bucket: { type: ['string', 'null'], description: '時間バケットのコード。不明なら null' }, trend: { type: ['string', 'null'], description: 'worsening | stable | improving | fluctuating | resolved | null' }, severity: { type: ['string', 'null'], description: 'mild | moderate | severe | null（主訴のみ）' }, quote: { type: 'string' } } } },
        context: { type: 'object', additionalProperties: false, required: ['age_band', 'sex', 'pregnancy'], properties: { age_band: { type: ['string', 'null'] }, sex: { type: ['string', 'null'], description: 'female | male | null' }, pregnancy: { type: ['string', 'null'], description: 'no | possible | confirmed | unknown | null' } } },
        unmapped: { type: 'array', items: { type: 'string' } }

  /* ---------------- 合成: LLM 優先、失敗時ローカル。数値項目はローカル結果で補完 ---------------- */
  async function extract(rawText, opts) {

    h += `<div class="inputbox"><div class="tawrap"><textarea id="freeText" rows="5" placeholder="例）40代女性。昨日から右下腹部痛が悪化、嘔気あり。反跳痛あり。体温38.2、CRP 5.8。妊娠反応陰性。">${esc(UI.draft || '')}</textarea><button class="mic ${UI.listening ? 'rec' : ''}" data-act="mic" title="音声入力" aria-label="音声入力">${UI.listening ? '⏹' : '🎤'}</button></div>
      <div class="inputacts"><button class="big" data-act="body">🧍 部位</button><button class="big" data-act="labs">🧪 検査値</button><button class="big primary grow" data-act="analyze" ${UI.busy ? 'disabled' : ''}>${UI.busy ? '解析中…' : '情報を追加'}</button></div>
      <div class="tiny muted">送信前に氏名・ID・日付・連絡先などは自動で除去されます${DDX.Extract.LLM.ready() ? '' : '。AI 未設定のためローカル解析で動作中（設定で API キーを登録）'}</div></div>`;
    if (UI.pending) {

    if (UI.lastAdded.length || (UI.lastResult && UI.lastResult.unmapped && UI.lastResult.unmapped.length)) {
      h += `<div class="card"><h2>読み取った項目 <span class="cnt">${UI.lastResult && UI.lastResult.llm && UI.lastResult.llm.ok ? 'AI' : 'ローカル解析'}${UI.lastResult && UI.lastResult.llm && UI.lastResult.llm.ok === false ? '（AI エラー→ローカル）' : ''}</span></h2><div class="items">`;
      for (const id of UI.lastAdded) { const o = st.observations.find(x => x.obs_id === id); if (!o) continue; const l = obsLine(o); h += `<div class="item ${l.absent ? 'abs' : ''}"><div class="grow"><b>${esc(l.label)}</b> ${esc(l.value)}<div class="tiny muted">${esc(l.meta)}</div></div><button class="ghost" data-del="${o.obs_id}" aria-label="削除">✕</button></div>`; }
      if (UI.lastResult && UI.lastResult.unmapped && UI.lastResult.unmapped.length) h += `<div class="tiny muted" style="margin-top:6px">対応項目なし（記録のみ）: ${UI.lastResult.unmapped.map(esc).join('、')}</div>`;

  function qTextFor(feature_id) {
    const f = KB().feature[feature_id];
    const base = f.label.replace('（部位）', '');
    if (f.type === 'lab' || f.type === 'imaging') return `${base} を確認`;
    if (f.type === 'vital') return `${base} を測定`;
    return `${base} は？`;
  }
  function quickAnswerHtml(feature_id) {
    const f = KB().feature[feature_id];
    // 問診系(症状/主訴/既往)は「不明」、検査系(バイタル/診察/検査/画像)は「実施不可」で未取得扱いにする
    const askType = f.type === 'symptom' || f.type === 'chief_complaint' || f.type === 'history' || f.type === 'context';
    const naBtn = askType ? `<button data-qa="${feature_id}|unknown">不明</button>` : `<button data-qa="${feature_id}|not_assessed">実施不可</button>`;
    if (!f.values) return `<div class="qa"><button data-qa="${feature_id}|present">あり</button><button data-qa="${feature_id}|absent">なし</button>${naBtn}</div>`;
    // 選択肢に「なし/正常/陰性」が無い項目(黒色便・血便, 嘔吐の性状 等)は、否定回答 = absent ボタンを補う
    const hasNeg = f.values.some(v => /^(normal|none|neg|absent|no)$/.test(v.code) || /^(なし|正常|陰性|異常なし)$/.test(v.label));
    const noNeg = f.id === 'pain_onset_char'; // 発症様式など「なし」が意味を持たない項目
    const negBtn = (hasNeg || noNeg || !(askType || f.type === 'exam')) ? '' : `<button data-qa="${feature_id}|absent">なし</button>`;
    if (f.values.length <= 6) return `<div class="qa">${f.values.map(v => `<button data-qa="${feature_id}|present|${v.code}">${esc(v.label)}</button>`).join('')}${negBtn}${naBtn}</div>`;
    return `<div class="qa"><button data-ins="${esc(base(f))} ">入力欄に書く</button>${negBtn}${naBtn}</div>`;
    function base(f) { return f.label.replace(/（.*?）|\s*\(.*?\)/g, ''); }
  }
  function prevTag(id) { const t = KB().prevalenceTier && KB().prevalenceTier(id); return t ? `<span class="prev">${esc(t)}</span>` : ''; }
  function evidenceHtml(x) {
    const kb = KB(); const item = (s, cls) => { const f = kb.feature[s.feature_id]; const o = s.obs; const v = o ? (o.status === 'present' ? (f.values ? valueLabel(f, o.value_code) : 'あり') : (o.value_code && f.values ? valueLabel(f, o.value_code) + ' なし' : 'なし')) : ''; return `<span class="tag ${cls}">${esc(f.label.replace('（部位）', ''))}${v ? ': ' + esc(v) : ''}</span>`; };
    let h = '';
    if (x.support.length) h += `<div class="ev"><span class="lab">支持</span>${x.support.slice(0, 6).map(s => item(s, 'sup')).join('')}</div>`;
    if (x.refute.length) h += `<div class="ev"><span class="lab">反証</span>${x.refute.slice(0, 6).map(s => item(s, 'ref')).join('')}</div>`;
    const rels = kb.relByDisease[x.id] || []; const ids = [...new Set(rels.flatMap(r => r.ev || []))];
    if (ids.length) h += `<details class="tiny"><summary>根拠文献 ${ids.length}</summary>${ids.map(id => { const e = kb.evidenceById[id]; return e ? `<div><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a> ${e.year}, N=${e.n}</div>` : ''; }).join('')}</details>`;
    return h;
  }
  function renderResult() {
    if (!UI.last) { $('#view-result').innerHTML = ''; return; }
    const d = UI.last.ddx, n = UI.last.next, em = n.emergency, s = UI.last.safety;
    let h = bannersHtml();
    if (!d.nObs) { h += `<div class="card"><div class="empty">まだ情報がありません。「入力」で主訴を入れてください。</div></div>`; $('#view-result').innerHTML = h; return; }
    if (s.scope.status === 'out_of_scope') { $('#view-result').innerHTML = h; return; }
    // 1. 先に確認（安全ルール）
    if (n.forced.length) h += `<div class="card urgent"><h2>🚨 先に確認</h2>${n.forced.map(it => `<div class="qitem"><div class="q">${esc(qTextFor(it.feature_id))}</div><div class="tiny muted">${esc(it.forcedReason || '安全ルール')}${it.clears && it.clears.length ? ' · 除外対象: ' + it.clears.map(c => esc(c.label)).join('、') : ''}</div>${quickAnswerHtml(it.feature_id)}</div>`).join('')}</div>`;
    // 2. まず除外（緊急）
    h += `<div class="card"><h2>🟥 まず除外 <span class="cnt">${em.frame.length ? '候補に挙がった重大疾患 ' + em.frame.length : '候補なし'}</span></h2>`;
    if (!em.frame.length) h += `<div class="empty small">現在の情報で候補に挙がった重大疾患はありません${em.cleared.length ? '（除外済み: ' + em.cleared.map(m => esc(m.label)).join('、') + '）' : ''}</div>`;
    for (const m of em.frame) {
      const key = 'E' + m.id;
      h += `<div class="dx"><div class="head" data-toggle="${key}"><span class="name">${esc(m.label)}</span><span class="badge ${m.status}">${m.status === 'alert' ? '要注意' : '未除外'}</span></div>`;
      if (m.shortest) h += `<div class="qitem"><div class="q">→ ${esc(qTextFor(m.shortest.feature_id))}${m.shortest.key ? ' <span class="tiny">（決定的）</span>' : ''}</div>${quickAnswerHtml(m.shortest.feature_id)}</div>`;
      else h += `<div class="tiny muted">除外項目はすべて入力済み/結果待ち</div>`;
      if (UI.open[key]) h += `<div class="detail"><div class="tiny muted">${esc(m.note || '')}</div><div class="ev"><span class="lab">除外項目</span>${m.plan.map(x => `<span class="tag ${x.done ? (x.positive ? 'ref' : 'sup') : ''}">${x.done ? (x.positive ? '⚠' : '✓') : '○'} ${esc(x.label)}${x.key ? '★' : ''}</span>`).join('')}</div></div>`;
      h += `</div>`;
    }
    if (em.more && em.more.length) h += `<details class="small" style="margin-top:6px"><summary>ほかに候補となり得る重大疾患 (${em.more.length})</summary><div class="tiny muted" style="margin-top:4px">${em.more.map(m => esc(m.label)).join('、')}</div></details>`;
    if (em.cleared.length) h += `<div class="tiny muted" style="margin-top:6px">✓ 概ね除外: ${em.cleared.map(m => esc(m.label)).join('、')}</div>`;
    h += `</div>`;
    // 3. 可能性の高い順
    h += `<div class="card"><h2>🟦 可能性の高い順 ${d.insufficient ? '<span class="cnt">情報不足・暫定</span>' : ''}</h2><div class="tiny muted" style="margin:-4px 0 6px">所見で区別できない疾患は頻度の高い順</div>`;
    for (const x of d.likely.filter(x => !x.comorbid).slice(0, 5)) { const key = 'L' + x.id; h += `<div class="dx"><div class="head" data-toggle="${key}"><span class="rank">${x.rank}</span><span class="name">${esc(x.label)}</span>${prevTag(x.id)}<span class="badge ${x.fit}">${{ high: '高', mid: '中', low: '低' }[x.fit]}</span></div>${UI.open[key] ? `<div class="detail">${evidenceHtml(x)}</div>` : ''}</div>`; }
    const more = d.likely.filter(x => !x.comorbid).slice(5);
    if (more.length) h += `<details class="small" style="margin-top:6px"><summary>6位以下 (${more.length})</summary>${more.map(x => `<div class="dx"><div class="head" data-toggle="L${x.id}"><span class="rank">${x.rank}</span><span class="name">${esc(x.label)}</span>${prevTag(x.id)}<span class="badge ${x.fit}">${{ high: '高', mid: '中', low: '低' }[x.fit]}</span></div>${UI.open['L' + x.id] ? `<div class="detail">${evidenceHtml(x)}</div>` : ''}</div>`).join('')}</details>`;
    const como = d.likely.filter(x => x.comorbid); if (como.length) h += `<div class="tiny muted" style="margin-top:6px">併存の可能性: ${como.map(x => esc(x.label)).join('、')}</div>`;
    h += `</div>`;
    // 4. 次に聞く・調べる
    h += `<div class="card"><h2>❓ 次に聞く・調べる</h2>`;
    if (!n.differential.top.length) h += `<div class="empty small">候補がありません</div>`;
    for (const it of n.differential.top) h += `<div class="qitem"><div class="q">${esc(qTextFor(it.feature_id))}${it.inEmergency ? ' <span class="badge alert">除外にも有効</span>' : ''}</div><div class="tiny muted">${esc((it.reasons || [])[0] || '')}</div>${quickAnswerHtml(it.feature_id)}</div>`;
    h += `</div>`;
    h += `<div class="disc">研究用プロトタイプ。順位は未較正の適合度で、確率ではありません。最終判断は医師が行ってください。</div>`;
    $('#view-result').innerHTML = h;
  }

  /* ---------- body picker (複数選択 → 確定で入力欄に挿入。前面/背面 → 大部位 → 細部) ---------- */
  function openBody() { UI.body = { view: UI.bodyView || 'front', fineKey: null, sel: [] }; $('#sheetWrap').classList.add('open'); renderBody(); }
  function closeBody() { $('#sheetWrap').classList.remove('open'); $('#sheetWrap').classList.remove('full'); UI.body = null; }
  function imgTag(mirror) { const bm = DDX.BODYMAP; return `<image href="${bm.img.src}" x="0" y="0" width="${bm.img.w}" height="${bm.img.h}" ${mirror ? `transform="translate(${bm.img.w},0) scale(-1,1)"` : ''}/>`; }
  const clean = t => t.replace(/（.*?）/g, '');
  function bodyToggle(id) { const b = UI.body; const i = b.sel.indexOf(id); if (i >= 0) b.sel.splice(i, 1); else b.sel.push(id); }
  function selLabels() { return UI.body.sel.map(id => { const r = DDX.BODYMAP.find(id); return r ? clean(r.label) : id; }); }
  function coarseSvg(viewKey, isSel) {
    const bm = DDX.BODYMAP, view = bm.views[viewKey];
    return `<div class="bodycol"><div class="bodycap">${esc(view.label)}<span class="tiny muted">（${esc(view.note)}）</span></div><svg class="body coarse" viewBox="${bm.viewBox}" xmlns="http://www.w3.org/2000/svg">${imgTag(view.mirror)}${view.coarse.map(r => { const anySub = bm.fine[r.sub].regions.some(x => isSel(x.id)); return `<polygon points="${r.poly}" class="rg ${isSel(r.id) ? 'sel' : anySub ? 'has' : ''}" data-bregion="${r.id}"><title>${esc(r.label)}</title></polygon>${r.lbl ? `<text x="${r.lbl[0]}" y="${r.lbl[1]}" class="rl" data-bregion="${r.id}">${esc(clean(r.label))}</text>` : ''}`; }).join('')}</svg></div>`;
  }
  function renderBody() {
    const bm = DDX.BODYMAP, b = UI.body, isSel = id => b.sel.includes(id);
    $('#sheetWrap').classList.add('full');
    $('#sheetHd').innerHTML = `<div class="row"><b class="grow" style="font-size:19px">部位を選ぶ</b><button class="ghost" data-act="closeBody">閉じる</button></div>
      <div class="selbar"><div class="grow small">${b.sel.length ? '選択中: <b>' + selLabels().map(esc).join('・') + '</b>' : '<span class="muted">部位をタップして選択（複数可）</span>'}</div><button class="big primary" data-act="bodyCommit" ${b.sel.length ? '' : 'disabled'}>確定 (${b.sel.length})</button></div>`;
    let body = '';
    if (b.fineKey) {
      const f = bm.fine[b.fineKey]; const mirror = bm.viewOfFine(b.fineKey) === 'back';
      const parent = Object.values(bm.views).flatMap(v => v.coarse).find(c => c.sub === b.fineKey);
      body += `<div class="row" style="margin-bottom:6px"><button class="big" data-act="bodyCoarse">‹ 全身図へ戻る</button><b class="grow" style="font-size:19px">${esc(f.label)}</b>${parent ? `<button class="big ${isSel(parent.id) ? 'primary' : ''}" data-btoggle="${parent.id}">${isSel(parent.id) ? '✓ ' : ''}「${esc(clean(parent.label))}」全体</button>` : ''}</div>`;
      body += `<div class="bodywrap"><svg class="body fine" viewBox="${f.viewBox}" xmlns="http://www.w3.org/2000/svg">${imgTag(mirror)}${f.regions.map(r => `<polygon points="${r.poly}" class="rg ${isSel(r.id) ? 'sel' : ''}" data-btoggle="${r.id}"><title>${esc(r.label)}</title></polygon>${r.lbl ? `<text x="${r.lbl[0]}" y="${r.lbl[1]}" class="rl fine" data-btoggle="${r.id}">${esc(r.short || r.label)}</text>` : ''}`).join('')}</svg></div>`;
      body += `<div class="chips" style="margin-top:10px;justify-content:center">${f.regions.map(r => `<span class="chip ${isSel(r.id) ? 'sel' : ''}" data-btoggle="${r.id}">${isSel(r.id) ? '✓ ' : ''}${esc(r.label)}</span>`).join('')}</div>`;
    } else {
      body += `<div class="bodypair">${coarseSvg('front', isSel)}${coarseSvg('back', isSel)}</div><div class="tiny muted" style="text-align:center;margin-top:6px">大まかな部位をタップ → 細部を複数選択 → 確定</div>`;
    }
    $('#sheetBody').innerHTML = body;
  }
  function bodyCommit() { const labels = selLabels(); closeBody(); if (labels.length) insertText(labels.join('・') + 'に'); }
  /* ---------- 検査値パネル（一覧 → 電卓） ---------- */
  function openLabs() { UI.labs = { sel: null, buf: '' }; UI.labValues = UI.labValues || {}; $('#sheetWrap').classList.add('open'); renderLabs(); }
  function closeLabs() { $('#sheetWrap').classList.remove('open'); $('#sheetWrap').classList.remove('full'); UI.labs = null; }
  function renderLabs() {
    const Lb = DDX.LABS, st = UI.labs;
    $('#sheetHd').innerHTML = `<div class="row"><b class="grow">検査値（タップして数値を入力）</b><button class="ghost" data-act="closeLabs">閉じる</button></div>`;
    let h = '';
    if (st.sel) {
      const it = Lb.byId[st.sel];
      h += `<div class="row" style="margin-bottom:6px"><button class="ghost" data-act="labBack">‹ 一覧</button><b class="grow">${esc(it.label)} <span class="muted small">${esc(it.unit)}</span></b></div>`;
      if (it.choice) { h += `<div class="qa" style="flex-direction:column;align-items:stretch">${it.choice.map(([code, label]) => `<button class="big" data-labchoice="${code}">${esc(label)}</button>`).join('')}</div>`; $('#sheetBody').innerHTML = h; return; }
      h += `<div class="calc"><div class="disp">${esc(st.buf || '')}<span class="unit">${esc(it.unit)}</span></div>${it.hint ? `<div class="tiny muted">${esc(it.hint)}</div>` : ''}<div class="keys">${['7', '8', '9', '4', '5', '6', '1', '2', '3', '.', '0', '⌫'].map(k => `<button data-key="${k}">${k}</button>`).join('')}</div><div class="inputacts"><button class="big" data-act="labClear">クリア</button><button class="big primary grow" data-act="labCommit" ${st.buf ? '' : 'disabled'}>確定</button></div></div>`;
    } else {
      for (const gr of Lb.groups) {
        h += `<div class="fsec"><div class="lab">${esc(gr.label)}</div><div class="labgrid">${gr.items.map(it => { const v = UI.labValues[it.id]; return `<button class="labbtn ${v !== undefined ? 'done' : ''}" data-lab="${it.id}"><span class="ln">${esc(it.label)}</span><span class="lv">${v !== undefined ? esc(String(v)) + (it.unit ? ' ' + esc(it.unit) : '') : (it.unit || 'タップして選択')}</span></button>`; }).join('')}</div></div>`;
      }
      h += `<div class="tiny muted" style="margin-top:8px">数値は本アプリの閾値で区分して登録します。対応項目のない検査は入力欄にテキストとして残します。単位・基準値: <a href="${esc(Lb.source.url)}" target="_blank" rel="noopener">${esc(Lb.source.label)}</a></div>`;
    }
    $('#sheetBody').innerHTML = h;
  }
  function labCommit() {
    const st = UI.labs, it = DDX.LABS.byId[st.sel]; let v = parseFloat(st.buf); if (!(v >= 0)) { toast('数値を入力してください'); return; }
    if (it.norm) v = it.norm(v);
    UI.labValues[it.id] = v;
    if (it.map) {
      const mine = DDX.LABS.resolve(UI.labValues, UI.state.context).filter(x => x.from.includes(it.id));
      for (const x of mine) UI.state.add({ feature_id: x.f, status: x.status, value_code: x.code, time_context: { elapsed_bucket: 'h_1_3', trend: 'unknown' }, note: `${x.from.map(id => DDX.LABS.byId[id].label + ' ' + UI.labValues[id]).join(' / ')} ${x.from.length === 1 ? it.unit : ''}`.trim() });
      const pos = mine.filter(x => x.status === 'present').map(x => { const f = KB().feature[x.f]; return f.multi || x.f === 'ast_alt_pattern' ? valueLabel(f, x.code) : `${f.label.replace(/（.*?）/g, '')} ${valueLabel(f, x.code)}`; });
      toast(`${it.label} ${v} ${it.unit} → ${pos.length ? pos.join('、') : '異常なし'}`); recompute('lab_value');
    }
    else { insertText(`${it.label} ${v} ${it.unit}。`); toast(`${it.label} ${v} ${it.unit} を入力欄に追加`); }
    st.sel = null; st.buf = ''; renderLabs();
  }
  function insertText(t) { const ta = $('#freeText'); if (!ta) { UI.draft = (UI.draft || '') + t; return; } const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? ta.value.length; ta.value = ta.value.slice(0, s) + t + ta.value.slice(e); UI.draft = ta.value; ta.focus(); const pos = s + t.length; ta.setSelectionRange(pos, pos); }

  /* ---------- 音声入力 ---------- */
  let rec = null;
  function toggleMic() {
    const SR = g.SpeechRecognition || g.webkitSpeechRecognition;
    if (!SR) { toast('この環境では音声入力を使えません（Chrome/Safari の通常ブラウザで開いてください）'); return; }
    if (UI.listening) { try { rec.stop(); } catch (e) { } return; }
    rec = new SR(); rec.lang = 'ja-JP'; rec.continuous = true; rec.interimResults = true;
    let finalText = '';
    rec.onresult = ev => { let interim = ''; for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) finalText += r[0].transcript + '。'; else interim += r[0].transcript; } const ta = $('#freeText'); if (ta) { ta.value = (UI.draftBase || '') + finalText + interim; UI.draft = ta.value; } };
    rec.onend = () => { UI.listening = false; UI.draft = ($('#freeText') || {}).value || UI.draft; renderInput(); };
    rec.onerror = e => { toast('音声入力エラー: ' + (e.error || '')); UI.listening = false; renderInput(); };
    UI.draftBase = (($('#freeText') || {}).value || '') + (UI.draft && !/[。\n]$/.test(UI.draft) && UI.draft ? '' : '');
    if (UI.draftBase && !/[。\n\s]$/.test(UI.draftBase)) UI.draftBase += '。';
    UI.listening = true; renderInput(); try { rec.start(); } catch (e) { UI.listening = false; renderInput(); toast('音声入力を開始できません'); }
  }

  /* ---------- 解析 → 追加 ---------- */
  async function analyze() {
    const text = (($('#freeText') || {}).value || UI.draft || '').trim();
    if (!text) { toast('テキストを入力してください'); return; }
    UI.draft = text;
    const L = DDX.Extract.LLM;
    if (L.ready() && L.config.confirm) { UI.pending = { text, scrubbed: DDX.Extract.scrub(text) }; renderInput(); return; }
    await runExtract(text, L.ready());
  }
  async function runExtract(text, useLLM) {
    UI.pending = null; UI.busy = true; renderInput();
    let res;
    try { res = await DDX.Extract.extract(text, { useLLM }); } catch (e) { res = { items: [], context: {}, unmapped: [], llm: { ok: false, error: String(e) } }; }
    UI.busy = false;
    UI.lastResult = res; UI.lastAdded = [];
    for (const k in res.context) if (res.context[k] && !UI.state.context[k] || (k === 'pregnancy' && UI.state.context.pregnancy === 'unknown')) UI.state.context[k] = res.context[k];
    if (UI.state.context.sex === 'male') UI.state.context.pregnancy = 'no';
    for (const it of res.items) { try { const o = UI.state.add(it); UI.lastAdded.push(o.obs_id); } catch (e) { console.warn(e); } }
    UI.draft = ''; const ta = $('#freeText'); if (ta) ta.value = '';
    DDX.Audit.log({ action: 'extract', case_token: UI.state.case_token, provider: res.provider, llm: res.llm, n_items: res.items.length, removed: (res.scrubbed && res.scrubbed.removed || []).map(r => r.kind) });
    toast(res.items.length ? `${res.items.length} 項目を追加しました` : '該当する項目が見つかりませんでした');
    await recompute('extract');
    if (res.items.length) { UI.tab = 'result'; renderTabs(); }
  }
  function quickAnswer(spec) {
    const [fid, status, value] = spec.split('|');
    const f = KB().feature[fid];
    UI.state.add({ feature_id: fid, status, value_code: value || null, time_context: { elapsed_bucket: f.anchor === 'none' ? null : (f.type === 'vital' || f.type === 'exam' ? 'min_lt10' : f.type === 'lab' || f.type === 'imaging' ? 'h_1_3' : 'unknown'), trend: 'unknown' } });
    toast(`${f.label.replace('（部位）', '')}: ${status === 'present' ? (value ? valueLabel(f, value) : 'あり') : status === 'absent' ? 'なし' : status === 'unknown' ? '不明' : '実施不可'}`);
    recompute('quick_answer');
  }

  /* ---------- demo ---------- */
  function demoStart(i) { const d = DDX.DEMO_TEXT[i]; if (!d) return; UI.state = new DDX.ClinicalState({}); UI.labValues = {}; UI.demoQueue = { label: d.label, steps: d.steps.slice() }; UI.lastAdded = []; UI.lastResult = null; UI.tab = 'input'; demoNext(); }
  function demoNext() { if (!UI.demoQueue || !UI.demoQueue.steps.length) return; const t = UI.demoQueue.steps.shift(); if (!UI.demoQueue.steps.length) UI.demoQueue = null; UI.draft = t; UI.tab = 'input'; renderAll(); }

  /* ---------- events ---------- */
  function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
  function bind() {
    document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => { UI.tab = b.dataset.tab; renderTabs(); }));
    $('#sheetWrap .bg').addEventListener('click', () => { if (UI.labs) closeLabs(); else closeBody(); });
    document.addEventListener('input', e => { if (e.target.id === 'freeText') UI.draft = e.target.value; });
    document.addEventListener('change', e => { const t = e.target; if (t.dataset.ctx) { UI.state.context[t.dataset.ctx] = t.value || null; if (t.dataset.ctx === 'sex' && t.value === 'male') { UI.state.context.pregnancy = 'no'; UI.state.context.preg_stage = null; } if (t.dataset.ctx === 'pregnancy' && t.value === 'no') UI.state.context.preg_stage = null; if (t.dataset.ctx === 'preg_stage' && (t.value === 'first_tri' || t.value === 'late')) UI.state.context.pregnancy = 'confirmed'; recompute('context'); } });
    document.addEventListener('toggle', e => { const d = e.target.dataset && e.target.dataset.details; if (d) UI.open[d] = e.target.open; }, true);
    document.addEventListener('click', async e => {
      const el = e.target.closest('[data-act],[data-toggle],[data-del],[data-qa],[data-ins],[data-bregion],[data-bview],[data-btoggle],[data-lab],[data-key],[data-labchoice]'); if (!el) return; const d = el.dataset;
      if (d.toggle) { UI.open[d.toggle] = !UI.open[d.toggle]; renderResult(); return; }
      if (d.del) { UI.state.remove(d.del); UI.lastAdded = UI.lastAdded.filter(x => x !== d.del); recompute('delete'); return; }
      if (d.qa) { quickAnswer(d.qa); return; }
      if (d.ins) { UI.tab = 'input'; renderTabs(); insertText(d.ins); return; }
      if (d.lab) { UI.labs.sel = d.lab; UI.labs.buf = ''; renderLabs(); return; }
      if (d.labchoice) { const it = DDX.LABS.byId[UI.labs.sel]; const lab = (it.choice.find(c => c[0] === d.labchoice) || [])[1]; UI.labValues[it.id] = lab; UI.state.add({ feature_id: it.f, status: 'present', value_code: d.labchoice, time_context: { elapsed_bucket: 'h_1_3', trend: 'unknown' } }); toast(`${it.label}: ${lab}`); recompute('lab_value'); UI.labs.sel = null; renderLabs(); return; }
      if (d.key) { if (d.key === '⌫') UI.labs.buf = UI.labs.buf.slice(0, -1); else if (d.key === '.') { if (!UI.labs.buf.includes('.')) UI.labs.buf += UI.labs.buf ? '.' : '0.'; } else if (UI.labs.buf.length < 8) UI.labs.buf += d.key; renderLabs(); return; }
      if (d.bview) { UI.body.view = d.bview; UI.bodyView = d.bview; UI.body.fineKey = null; renderBody(); return; }
      if (d.btoggle) { bodyToggle(d.btoggle); renderBody(); return; }
      if (d.bregion) { const r = DDX.BODYMAP.find(d.bregion); if (r && r.sub) { UI.body.fineKey = r.sub; renderBody(); } else { bodyToggle(d.bregion); renderBody(); } return; }
      switch (d.act) {
        case 'mic': toggleMic(); break;
        case 'body': openBody(); break;
        case 'closeBody': closeBody(); break;
        case 'labs': openLabs(); break;
        case 'closeLabs': closeLabs(); break;
        case 'labBack': UI.labs.sel = null; UI.labs.buf = ''; renderLabs(); break;
        case 'labClear': UI.labs.buf = ''; renderLabs(); break;
        case 'labCommit': labCommit(); break;
        case 'bodyCoarse': UI.body.fineKey = null; renderBody(); break;
        case 'bodyCommit': bodyCommit(); break;
        case 'analyze': await analyze(); break;
        case 'send': await runExtract(UI.pending.text, true); break;
        case 'localOnly': await runExtract(UI.pending.text, false); break;
        case 'cancelSend': UI.pending = null; renderInput(); break;
        case 'saveLLM': { const L = DDX.Extract.LLM; L.config.apiKey = $('#apiKey').value.trim(); L.config.model = $('#model').value; L.config.confirm = $('#confirmSend').checked; LS.set('ddxnav_llm', { apiKey: L.config.apiKey, model: L.config.model, confirm: L.config.confirm }); toast('保存しました'); renderAll(); break; }
        case 'newCase': if (UI.confirmKey === 'newCase') { UI.confirmKey = null; UI.state = new DDX.ClinicalState({}); UI.labValues = {}; UI.lastAdded = []; UI.lastResult = null; UI.demoQueue = null; UI.open = {}; UI.draft = ''; recompute('new_case'); UI.tab = 'input'; } else { UI.confirmKey = 'newCase'; renderSettings(); setTimeout(() => { if (UI.confirmKey === 'newCase') { UI.confirmKey = null; renderSettings(); } }, 4000); } break;
        case 'exportCase': download(`ddx_case_${UI.state.case_token}.json`, JSON.stringify(UI.state.toJSON(), null, 2)); break;
        case 'exportLog': download('ddx_audit_log.json', DDX.Audit.export()); break;
        case 'clearLog': if (UI.confirmKey === 'clearLog') { UI.confirmKey = null; DDX.Audit.clear(); renderSettings(); } else { UI.confirmKey = 'clearLog'; renderSettings(); setTimeout(() => { if (UI.confirmKey === 'clearLog') { UI.confirmKey = null; renderSettings(); } }, 4000); } break;
        case 'demoStart': demoStart(+$('#demoSel').value); break;
        case 'demoNext': demoNext(); break;
      }
    });
  }
  UI.init = function () {
    const saved = LS.get('ddxnav_case', null);
    UI.state = saved ? DDX.ClinicalState.fromJSON(saved) : new DDX.ClinicalState({});
    const lc = LS.get('ddxnav_llm', null); if (lc) Object.assign(DDX.Extract.LLM.config, lc);
    bind(); recompute('boot');
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* 90_boot.js */
(function(){ if (typeof window !== 'undefined' && window.DDX && window.DDX.UI) window.addEventListener('DOMContentLoaded', () => window.DDX.UI.init()); })();

</script>
</body>
